<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="globe.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="globe-container"></div>
    
    <div class="controls">
        <button id="texture-toggle" class="control-button">Switch to Texture Mode</button>
        <button id="color-reset" class="control-button">Reset to Color Mode</button>
    </div>
    
    <!--
    Recommended GeoJSON for country borders:
    https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json
    Download and save as 'countries.geojson' in your src folder.
    -->
</body>
</html>
